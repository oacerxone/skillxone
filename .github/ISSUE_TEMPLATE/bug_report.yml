name: Bug report
description: Something in the software does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, commands or a URL path. Do not paste tokens, passwords or .env contents.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        [Local development, VPS (Mode A), Docker Compose (Mode B), Static export (Mode C), Not sure]
